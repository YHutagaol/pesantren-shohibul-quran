name: Strix Security Scan

on:
  push:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Jalankan Strix
        run: curl -sSL https://strix.ai/install | bash
        
      - name: Pindai Website
        env:
          STRIX_LLM: "gemini/gemini-1.5-flash-lite"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: strix -n --target https://pesantren-shohibul-quran.vercel.app
