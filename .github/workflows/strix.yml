name: Strix Security Scan

on:
  push:
    branches: [ main ]

jobs:
  security-scan: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Jalankan Strix
        run: curl -sSL https://strix.ai | bash
        
      - name: Pindai Website
        run: strix -n --target https://pesantren-shohibul-quran.vercel.app
